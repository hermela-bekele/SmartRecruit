services:
  - type: web
    name: smartrecruit-demo
    runtime: static
    rootDir: Application-Tracker
    buildCommand: npm install && npm run build:demo
    staticPublishPath: dist
    envVars:
      - key: VITE_DEMO_MODE
        value: "true"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
